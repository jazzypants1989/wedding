name: Deploy

on:
  push:
    branches: [main]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  # Run tests first
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # typecheck needs the `typescript` devDependency; `npm test` is zero-dep
      # but we install once so both steps run.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Without a configured admin hash, adminLogin() can't authenticate and every
      # admin integration suite silently skips (DEFERRED.md). Generate a scrypt hash
      # for a known password via the zero-dep policy module and export it plus
      # TEST_ADMIN_PASSWORD so the admin surface is actually exercised in CI.
      - name: Configure admin auth for tests
        run: |
          PW='CiTestPassw0rd'
          HASH=$(node -e "import('./core/password-policy.js').then(m => process.stdout.write(m.hashPassword('$PW')))")
          echo "TEST_ADMIN_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

  # Deploy only if tests pass
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2420
          command_timeout: 5m
          script: |
            set -e
            cd ~/services/wedding

            echo "==> Current state:"
            echo "    Commit: $(git log -1 --format='%h %s')"
            echo "    Container: $(docker inspect --format='{{.State.Health.Status}}' wedding 2>/dev/null || echo 'not running')"

            echo ""
            echo "==> Backing up database (WAL-safe VACUUM INTO)..."
            docker exec wedding node scripts/backup-db.js \
              || echo "    Skipped (container not running)"

            echo ""
            echo "==> Pulling latest code..."
            git pull

            echo ""
            echo "==> Rebuilding and restarting..."
            docker compose up -d --build

            echo ""
            echo "==> Waiting for healthy..."
            for i in {1..30}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' wedding 2>/dev/null || echo "starting")
              echo "    [$i/30] $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo ""
                echo "==> Deploy complete!"
                exit 0
              fi
              sleep 1
            done

            echo ""
            echo "==> ERROR: Health check timed out"
            docker logs --tail 20 wedding
            exit 1
