<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effects Studio - Jordana & Jesse</title>
  <meta name="description" content="Customize visual effects for Jordana and Jesse's wedding site">
  <meta name="theme-color" content="#eee6dc">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/effects.css">
  <link rel="stylesheet" href="/pages/effects/effects-page.css">
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <div class="hero hero--small">
    <picture>
      <source media="(min-width: 768px)" srcset="/images/top-desktop.png">
      <img src="/images/top-mobile.png" alt="" class="hero-image" loading="eager">
    </picture>
  </div>

  <header class="site-header">
    <h1 class="couple-names"><a href="/" class="home-link">Jordana & Jesse</a></h1>
    <p class="wedding-info">April 26, 2026 &bull; Portland, OR</p>
  </header>

  <nav class="desktop-nav" aria-label="Main navigation">
    <ul class="nav-list">
      <li><a href="/" class="nav-link">Home</a></li>
      <li><a href="/#schedule" class="nav-link">Schedule</a></li>
      <li><a href="/#dress-code" class="nav-link">Dress Code</a></li>
      <li><a href="/rsvp" class="nav-link">RSVP</a></li>
      <li><a href="/effects" class="nav-link nav-link--active">Effects</a></li>
    </ul>
  </nav>

  <main id="main-content">
    <section class="content-section effects-config-section">
      <h2>Effects Studio</h2>
      <p class="effects-config-intro">Customize the visual magic on this site. Toggle effects on or off and fine-tune each one to your liking.</p>

      <div class="effects-config-actions">
        <button type="button" class="btn btn--secondary effects-action-btn" id="effects-all-on">All On</button>
        <button type="button" class="btn btn--secondary effects-action-btn" id="effects-all-off">All Off</button>
        <button type="button" class="btn btn--secondary effects-action-btn" id="effects-reset-all">Reset All</button>
        <button type="button" class="btn btn--secondary effects-action-btn effects-action-btn--accent" id="effects-randomize">Surprise Me</button>
      </div>

      <div id="effects-card-container" class="effects-card-grid">
        <!-- Cards rendered by JS -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <picture>
      <source media="(min-width: 768px)" srcset="/images/bottom-desktop.png">
      <img src="/images/bottom-mobile.png" alt="" loading="lazy">
    </picture>
  </footer>

  <script type="module" src="/pages/effects/effects-page.js"></script>
</body>

</html>
